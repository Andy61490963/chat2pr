name: 收件匣設計對照驗收
on:
  push:
    branches: [inbox-b]
    paths: [.github/workflows/inbox-b-shots.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell && sudo apt-get install -y fonts-noto-cjk
      - name: 截取同一套虛構資料的改版前後畫面
        env:
          E2E_PORT: '5337'
          INBOX_SHOTS_DIR: ${{ runner.temp }}/inbox-shots
        run: |
          git restore --source=d2458fc4e082610baf03490dd42817263c5c257d -- src
          INBOX_SHOTS_STAGE=改版前 npx playwright test e2e/inbox-flow-shots.spec.ts --workers=2
          git restore --source=HEAD -- src
          INBOX_SHOTS_STAGE=改版後 npx playwright test e2e/inbox-flow-shots.spec.ts --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inbox-shots
          path: ${{ runner.temp }}/inbox-shots
          retention-days: 7
