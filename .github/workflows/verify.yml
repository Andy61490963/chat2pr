name: 驗證第一版工作流程
on: [push, pull_request]
permissions:
  contents: read
jobs:
  dashboard:
    name: 看板瀏覽器驗收
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:e2e -- --workers=2
        env:
          E2E_PORT: 5336
      - name: 保留收件匣桌面與手機截圖
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: inbox-a-shots
          path: test-results/**/[13]*x*.png
          if-no-files-found: warn
          retention-days: 14
      - name: 保存訂閱推論異常與通知的驗收截圖
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: inference-health-screenshots
          path: |
            test-results/**/推論異常.png
            test-results/**/異常通知.png
          if-no-files-found: error
          retention-days: 14
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安裝依賴與準備隔離環境
        run: |
          if ! command -v pdftotext >/dev/null || ! command -v pdfinfo >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils poppler-data
          fi
          npm ci
          npm run init
          docker build -f worker/Dockerfile -t line-agentflow-worker:local .
          docker build -f infra/source/Dockerfile -t line-agentflow-source:local .
          docker compose --profile full --profile test up -d --build --wait db-test egress
      - name: 檢查型別、整合測試與建置
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: 清理測試容器
        if: always()
        run: docker compose --profile full --profile test down
