name: 驗證第一版工作流程
on: [push, pull_request]
permissions:
  contents: read
jobs:
  dashboard:
    name: 看板瀏覽器驗收
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - name: 收件匣改版前截圖與行為驗證
        run: |
          mkdir -p "$RUNNER_TEMP/inbox-shots"
          INBOX_SHOT_DIR="$RUNNER_TEMP/inbox-shots" npx playwright test e2e/inbox-review-states.spec.ts -g '六種狀態截圖' --workers=2
          npx playwright test e2e/inbox-review-flow.spec.ts --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inbox-a-shots
          path: ${{ runner.temp }}/inbox-shots/*.png
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安裝依賴與準備隔離環境
        run: |
          if ! command -v pdftotext >/dev/null || ! command -v pdfinfo >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils poppler-data
          fi
          npm ci
          npm run init
          docker build -f worker/Dockerfile -t line-agentflow-worker:local .
          docker build -f infra/source/Dockerfile -t line-agentflow-source:local .
          docker compose --profile full --profile test up -d --build --wait db-test egress
      - name: 檢查型別、整合測試與建置
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: 清理測試容器
        if: always()
        run: docker compose --profile full --profile test down
